<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <!-- Title -->
  <title>Detailed Siphon Schematic with Annotations</title>

  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E74C3C" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498DB" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" fill="#FAFAFA"/>

  <!-- Container/Reservoir -->
  <rect x="40" y="140" width="100" height="160" fill="#FFFFFF" stroke="#000" stroke-width="2.5"/>

  <!-- Water in container -->
  <rect x="42" y="180" width="96" height="118" fill="#3498DB" opacity="0.25"/>
  <line x1="42" y1="180" x2="138" y2="180" stroke="#3498DB" stroke-width="2.5"/>

  <!-- Container area label -->
  <text x="90" y="265" font-family="serif" font-size="11" fill="#555" text-anchor="middle">A₀</text>

  <!-- Pipe cross-section area label -->
  <text x="75" y="130" font-family="serif" font-size="10" fill="#555">A</text>

  <!-- Pipe segments with proper thickness -->
  <!-- Inner and outer walls -->
  <!-- Segment 1: A to B -->
  <line x1="75" y1="298" x2="75" y2="90" stroke="#2C3E50" stroke-width="4"/>
  <line x1="83" y1="298" x2="83" y2="90" stroke="#2C3E50" stroke-width="4"/>

  <!-- Segment 2: B to C (arc over top) -->
  <path d="M 75 90 Q 130 55, 185 90" fill="none" stroke="#2C3E50" stroke-width="4"/>
  <path d="M 83 90 Q 138 63, 193 90" fill="none" stroke="#2C3E50" stroke-width="4"/>

  <!-- Segment 3: C to D -->
  <line x1="185" y1="90" x2="280" y2="220" stroke="#2C3E50" stroke-width="4"/>
  <line x1="193" y1="90" x2="288" y2="220" stroke="#2C3E50" stroke-width="4"/>

  <!-- Segment 4: D to E (outlet) -->
  <line x1="280" y1="220" x2="420" y2="270" stroke="#2C3E50" stroke-width="4"/>
  <line x1="288" y1="220" x2="428" y2="270" stroke="#2C3E50" stroke-width="4"/>

  <!-- Water column inside pipe -->
  <line x1="79" y1="298" x2="79" y2="180" stroke="#3498DB" stroke-width="3" opacity="0.7"/>
  <path d="M 79 90 Q 134 59, 189 90" fill="none" stroke="#3498DB" stroke-width="3" opacity="0.7"/>
  <line x1="189" y1="90" x2="284" y2="220" stroke="#3498DB" stroke-width="3" opacity="0.7"/>
  <line x1="284" y1="220" x2="424" y2="270" stroke="#3498DB" stroke-width="3" opacity="0.7"/>

  <!-- Node points -->
  <circle cx="75" cy="298" r="4" fill="#E74C3C"/>
  <text x="55" y="320" font-family="serif" font-size="14" font-weight="bold">A</text>
  <text x="55" y="310" font-family="serif" font-size="11" fill="#666">(0, h₀)</text>

  <circle cx="75" cy="90" r="4" fill="#E74C3C"/>
  <text x="50" y="85" font-family="serif" font-size="14" font-weight="bold">B</text>
  <text x="40" y="75" font-family="serif" font-size="11" fill="#666">(x₁, h₁)</text>

  <circle cx="185" cy="90" r="4" fill="#E74C3C"/>
  <text x="190" y="75" font-family="serif" font-size="14" font-weight="bold">C</text>
  <text x="180" y="65" font-family="serif" font-size="11" fill="#666">(x₂, h₂)</text>

  <circle cx="280" cy="220" r="4" fill="#E74C3C"/>
  <text x="260" y="245" font-family="serif" font-size="14" font-weight="bold">D</text>
  <text x="250" y="235" font-family="serif" font-size="11" fill="#666">(x₃, h₃)</text>

  <circle cx="420" cy="270" r="4" fill="#E74C3C"/>
  <text x="430" y="275" font-family="serif" font-size="14" font-weight="bold">E</text>
  <text x="420" y="285" font-family="serif" font-size="11" fill="#666">(x₄, h₄)</text>

  <!-- Reference datum -->
  <line x1="0" y1="298" x2="500" y2="298" stroke="#95A5A6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="460" y="315" font-family="serif" font-size="12" fill="#7F8C8D">z = 0 (datum)</text>

  <!-- Height dimension lines -->
  <!-- h_c(t) -->
  <line x1="150" y1="180" x2="170" y2="180" stroke="#3498DB" stroke-width="1" marker-end="url(#arrow-blue)"/>
  <line x1="150" y1="298" x2="170" y2="298" stroke="#3498DB" stroke-width="1" marker-start="url(#arrow-blue)"/>
  <line x1="160" y1="180" x2="160" y2="298" stroke="#3498DB" stroke-width="1"/>
  <text x="175" y="245" font-family="serif" font-size="13" fill="#2980B9" font-style="italic">h_c(t)</text>

  <!-- Segment length annotations -->
  <text x="55" y="200" font-family="serif" font-size="11" fill="#555" font-style="italic">L₁</text>
  <text x="125" y="60" font-family="serif" font-size="11" fill="#555" font-style="italic">L₂</text>
  <text x="225" y="150" font-family="serif" font-size="11" fill="#555" font-style="italic">L₃</text>
  <text x="340" y="245" font-family="serif" font-size="11" fill="#555" font-style="italic">L₄</text>

  <!-- Flow direction -->
  <path d="M 360 255 L 395 265" fill="none" stroke="#E74C3C" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="325" y="240" font-family="serif" font-size="12" fill="#C0392B" font-style="italic" font-weight="bold">v(t)</text>

  <!-- Pressure annotations -->
  <text x="145" y="165" font-family="serif" font-size="11" fill="#7F8C8D">p_atm</text>
  <text x="435" y="255" font-family="serif" font-size="11" fill="#7F8C8D">p_atm</text>

  <!-- Arc length coordinate -->
  <path d="M 79 240 Q 100 200, 79 180" fill="none" stroke="#9B59B6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="105" y="210" font-family="serif" font-size="11" fill="#8E44AD" font-style="italic">L(t)</text>

  <!-- Diameter annotation -->
  <line x1="75" y1="120" x2="83" y2="120" stroke="#000" stroke-width="1"/>
  <line x1="73" y1="118" x2="73" y2="122" stroke="#000" stroke-width="1"/>
  <line x1="85" y1="118" x2="85" y2="122" stroke="#000" stroke-width="1"/>
  <text x="65" y="115" font-family="serif" font-size="10" fill="#555" font-style="italic">D</text>

  <!-- Title -->
  <text x="250" y="25" font-family="serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">Self-Starting Siphon: Geometric Configuration</text>

</svg>
