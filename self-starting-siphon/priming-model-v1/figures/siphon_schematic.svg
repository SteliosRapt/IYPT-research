<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Title -->
  <title>Siphon Schematic Diagram</title>

  <!-- Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Container/Reservoir -->
  <rect x="20" y="120" width="80" height="140" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Water in container -->
  <rect x="22" y="160" width="76" height="98" fill="#4A90E2" opacity="0.3"/>
  <line x1="22" y1="160" x2="98" y2="160" stroke="#4A90E2" stroke-width="2"/>

  <!-- Water level label -->
  <text x="110" y="165" font-family="serif" font-size="12" fill="#000">h_c(t)</text>

  <!-- Pipe segments -->
  <!-- Segment 1: A to B (rising in container) -->
  <line x1="60" y1="260" x2="60" y2="80" stroke="#000" stroke-width="3"/>
  <line x1="66" y1="260" x2="66" y2="80" stroke="#000" stroke-width="3"/>

  <!-- Segment 2: B to C (over the top) -->
  <path d="M 60 80 Q 100 50, 140 80" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M 66 80 Q 106 56, 146 80" fill="none" stroke="#000" stroke-width="3"/>

  <!-- Segment 3: C to D (descending) -->
  <line x1="140" y1="80" x2="220" y2="200" stroke="#000" stroke-width="3"/>
  <line x1="146" y1="80" x2="226" y2="200" stroke="#000" stroke-width="3"/>

  <!-- Segment 4: D to E (outlet) -->
  <line x1="220" y1="200" x2="340" y2="240" stroke="#000" stroke-width="3"/>
  <line x1="226" y1="200" x2="346" y2="240" stroke="#000" stroke-width="3"/>

  <!-- Water inside pipe (blue fill) -->
  <line x1="63" y1="260" x2="63" y2="160" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>
  <path d="M 63 80 Q 103 53, 143 80 L 223 200 L 343 240" fill="none" stroke="#4A90E2" stroke-width="2" opacity="0.6"/>

  <!-- Point labels -->
  <circle cx="60" cy="260" r="3" fill="#000"/>
  <text x="45" y="275" font-family="serif" font-size="14" font-weight="bold">A</text>

  <circle cx="60" cy="80" r="3" fill="#000"/>
  <text x="45" y="75" font-family="serif" font-size="14" font-weight="bold">B</text>

  <circle cx="140" cy="80" r="3" fill="#000"/>
  <text x="135" y="65" font-family="serif" font-size="14" font-weight="bold">C</text>

  <circle cx="220" cy="200" r="3" fill="#000"/>
  <text x="205" y="220" font-family="serif" font-size="14" font-weight="bold">D</text>

  <circle cx="340" cy="240" r="3" fill="#000"/>
  <text x="350" y="245" font-family="serif" font-size="14" font-weight="bold">E</text>

  <!-- Ground reference line -->
  <line x1="0" y1="260" x2="400" y2="260" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="380" y="275" font-family="serif" font-size="11" fill="#666">z = 0</text>

  <!-- Height annotations -->
  <!-- h_0 -->
  <line x1="30" y1="260" x2="30" y2="260" stroke="#999" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="5" y="265" font-family="serif" font-size="11" fill="#333">h_0</text>

  <!-- Atmospheric pressure arrows -->
  <text x="105" y="145" font-family="serif" font-size="10" fill="#666">p_atm</text>
  <text x="350" y="225" font-family="serif" font-size="10" fill="#666">p_atm</text>

  <!-- Flow direction arrow -->
  <path d="M 280 230 L 310 235" fill="none" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="265" y="220" font-family="serif" font-size="11" fill="#E74C3C" font-style="italic">flow</text>

</svg>
