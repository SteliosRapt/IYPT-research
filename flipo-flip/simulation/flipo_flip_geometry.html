<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flipo Flip Geometry Explorer</title>
  <style>
    :root {
      --bg: #f2f5f9;
      --panel: #ffffff;
      --ink: #122038;
      --muted: #5a6a82;
      --border: #d8e0eb;
      --accent: #2f7de1;
      --danger: #c53030;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #dce9fa 0%, transparent 32%),
        radial-gradient(circle at 88% 12%, #e9f0ff 0%, transparent 30%),
        var(--bg);
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      gap: 1rem;
    }

    .controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem;
      box-shadow: 0 8px 20px rgba(22, 36, 66, 0.06);
      display: grid;
      gap: 0.8rem;
    }

    .controls h1 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .controls .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .control-grid {
      display: grid;
      gap: 0.7rem;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
    }

    .slider-row {
      display: grid;
      gap: 0.3rem;
    }

    .slider-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .num-box {
      width: 7.2rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.34rem 0.5rem;
      font-size: 0.88rem;
      color: #1b2d49;
      background: #fff;
    }

    .num-box:focus {
      outline: 2px solid #b8d6ff;
      outline-offset: 1px;
      border-color: #a6c6f4;
    }

    .slider-row input[type="range"] {
      width: 100%;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .settings-panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fbff;
      padding: 0.35rem 0.55rem 0.55rem;
    }

    .settings-panel summary {
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1f3459;
      list-style: none;
      user-select: none;
    }

    .settings-panel summary::-webkit-details-marker {
      display: none;
    }

    .settings-panel summary::before {
      content: "▸";
      display: inline-block;
      margin-right: 0.45rem;
      color: #45658f;
      transform: translateY(-0.01rem);
    }

    .settings-panel[open] summary::before {
      content: "▾";
    }

    .settings-body {
      margin-top: 0.45rem;
      display: grid;
      gap: 0.45rem;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0.6rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: #dbeafe;
      color: #17417f;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
    }

    #note {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.1rem;
    }

    #note.warn {
      color: var(--danger);
    }

    .views {
      display: grid;
      gap: 0.8rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 340px;
      box-shadow: 0 8px 20px rgba(22, 36, 66, 0.06);
    }

    .panel h2 {
      margin: 0;
      padding: 0.68rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      color: #1f3459;
      background: #f8fbff;
    }

    .viewport {
      width: 100%;
      height: 100%;
      display: block;
      min-height: 270px;
    }

    .side-controls {
      padding: 0.55rem 0.7rem 0.75rem;
      border-top: 1px solid var(--border);
      background: #fbfdff;
      display: grid;
      gap: 0.38rem;
    }

    .side-controls label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      color: var(--muted);
    }

    #rollSlider {
      width: 100%;
    }

    @media (max-width: 980px) {
      .control-grid {
        grid-template-columns: 1fr;
      }

      .views {
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="controls">
      <h1>Flipo Flip Geometry Explorer</h1>
      <p class="sub">Adjust <strong>R</strong>, <strong>w</strong>, and <strong>h</strong> and inspect the source bicylinder, assembled toy, and 2D rolling side view.</p>

      <div class="control-grid">
        <label class="slider-row" for="radius">
          <span class="slider-top">
            <span>R (bicylinder radius, cm)</span>
            <input class="num-box" id="radiusInput" type="number" min="0.1" step="0.1" />
          </span>
          <input id="radius" type="range" min="0.1" max="300" step="0.1" />
        </label>

        <label class="slider-row" for="width">
          <span class="slider-top">
            <span>w (square side, cm)</span>
            <input class="num-box" id="widthInput" type="number" min="0.1" step="0.1" />
          </span>
          <input id="width" type="range" min="0.1" max="300" step="0.1" />
        </label>

        <label class="slider-row" for="height">
          <span class="slider-top">
            <span>h (prism height, cm)</span>
            <input class="num-box" id="heightInput" type="number" min="0.1" max="10" step="0.01" />
          </span>
          <input id="height" type="range" min="0.1" max="10" step="0.01" />
        </label>
      </div>

      <div class="buttons">
        <button id="resetDefaults">Reset to default values</button>
        <button id="resetView">Reset Cameras</button>
        <button class="primary" id="downloadStl">Download STL</button>
      </div>

      <details class="settings-panel">
        <summary>Settings</summary>
        <div class="settings-body">
          <label class="slider-row" for="meshDetail">
            <span class="slider-top">
              <span>Mesh detail factor</span>
              <input class="num-box" id="meshDetailInput" type="number" min="0.5" max="3.0" step="0.1" />
            </span>
            <input id="meshDetail" type="range" min="0.5" max="3.0" step="0.1" />
          </label>
        </div>
      </details>
      <p id="note"></p>
    </section>

    <section class="views">
      <article class="panel">
        <h2>2D Side View (Pure Patch Rolling - Slider Controlled)</h2>
        <canvas id="sideCanvas" class="viewport"></canvas>
        <div class="side-controls">
          <label for="rollSlider">
            <span>Pure patch phase position</span>
            <strong id="rollVal">0.0%</strong>
          </label>
          <input id="rollSlider" type="range" min="-100" max="100" step="0.1" value="0" />
        </div>
      </article>

      <article class="panel">
        <h2>Toy 3D View (Caps + Square Prism)</h2>
        <canvas id="toyCanvas" class="viewport"></canvas>
      </article>

      <article class="panel">
        <h2>Steinmetz Solid / Bicylinder (Interactive)</h2>
        <canvas id="steinCanvas" class="viewport"></canvas>
      </article>
    </section>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./js/geometry-app.js"></script>
</body>
</html>
